name: Build kobo-btpt 4.45 diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR32
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Patch for Kobo 4.45
        shell: python
        run: |
          from pathlib import Path
          import re

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          # Remove fragile private Nickel symbols.
          cc = re.sub(
              r'/\* Stop Bluetooth heartbeat.*?'
              r'static QEvent::Type \(\*TimeEvent_eventType\)\(\);\n',
              '''static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);
          ''',
              cc,
              flags=re.S,
          )

          # Remove heartbeat local variables.
          cc = re.sub(
              r'\tvoid \*bluetoothHeartbeat = NULL;\n'
              r'(\tfd_set rfds;\n'
              r'\tstruct timeval tv;\n)'
              r'\tstruct timespec last_event = \{ 0 \};\n'
              r'\tstruct timespec now = \{ 0 \};\n',
              r'\1',
              cc,
          )

          # Remove Bluetooth heartbeat block.
          cc = re.sub(
              r'\n\t\t/\* Bluetooth heartbeat to prevent Bluetooth from turning off \*/'
              r'.*?'
              r'(?=\n\t\t/\* Poll devices for input events \*/)',
              '',
              cc,
              flags=re.S,
          )

          # Remove heartbeat timestamp / PowerManager code.
          cc = re.sub(
              r'\n\t\t\t\t\t/\* Update Bluetooth heartbeat time \*/'
              r'.*?'
              r'(?=\n\t\t\t\t\t/\* Invoke the configured method \*/)',
              '',
              cc,
              flags=re.S,
          )

          # Fix temporary c_str pointer.
          cc = re.sub(
              r'const char \*method = pair\.second\s*'
              r'\.toStdString\(\)\.c_str\(\);\s*'
              r'invokeMainWindowController\(method\);',
              '''QByteArray method = pair.second.toUtf8();
                      invokeMainWindowController(method.constData());''',
              cc,
          )

          # Remove TimeLastUsedUpdater implementation.
          cc = re.sub(
              r'\nvoid TimeLastUsedUpdater::notify\(\)\n'
              r'\{.*?\n\}'
              r'(?=\nstatic int btpt_init)',
              '',
              cc,
              flags=re.S,
          )

          # Replace btpt_init and create a visible diagnostic file.
          cc = re.sub(
              r'static int btpt_init\(\)\n'
              r'\{.*?\n\}'
              r'(?=\n\nstatic struct nh_info)',
              '''static int btpt_init()
          {
              mkdir(BTPT_DIR, 0755);

              FILE *marker = fopen("/mnt/onboard/btpt-loaded.txt", "w");
              if (marker) {
                  fputs("kobo-btpt init reached\\n", marker);
                  fclose(marker);
              }

              BluetoothPageTurner *btpt = new BluetoothPageTurner();

              QObject::connect(
                  btpt, &QThread::finished,
                  btpt, &QObject::deleteLater);

              btpt->start();

              return 0;
          }''',
              cc,
              flags=re.S,
          )

          # Keep only MainWindowController symbols.
          cc = re.sub(
              r'static struct nh_dlsym btpt_dlsym\[\] = \{.*?\n\};',
              '''static struct nh_dlsym btpt_dlsym[] = {
              {
                  .name = "_ZN20MainWindowController14sharedInstanceEv",
                  .out = nh_symoutptr(MainWindowController_sharedInstance)
              },
              {
                  .name = "_ZNK20MainWindowController11currentViewEv",
                  .out = nh_symoutptr(MainWindowController_currentView)
              },
              {0},
          };''',
              cc,
              flags=re.S,
          )

          # Remove TimeLastUsedUpdater from header.
          h = re.sub(
              r'\n'
              r'signals:\n'
              r'\tvoid notify\(\);\n'
              r'\};\n'
              r'\n'
              r'class TimeLastUsedUpdater : public QObject\n'
              r'\{.*?\n'
              r'\};',
              '\n};',
              h,
              flags=re.S,
          )

          cc_path.write_text(cc)
          h_path.write_text(h)

          print("=== Checking patch ===")

          forbidden = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
          ]

          for s in forbidden:
              print(s, "FOUND" if s in cc else "removed")

          print(
              "marker:",
              "OK" if "btpt-loaded.txt" in cc else "MISSING"
          )

          for s in forbidden:
              assert s not in cc, f"Still present: {s}"

          assert "TimeLastUsedUpdater" not in h
          assert "void notify();" not in h
          assert "btpt-loaded.txt" in cc

          print("Patch OK")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i 's|<linux/input-event-codes.h>|"input-event-codes.h"|' src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-445-diagnostic
          path: KoboRoot.tgz
