name: Build kobo-btpt single-double debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR32
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Patch Kobo 4.45 single-double with permanent debug
        shell: python
        run: |
          from pathlib import Path

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          # ============================================================
          # Includes required by permanent debug logging
          # ============================================================

          cc = cc.replace(
              "#include <stdio.h>",
              "#include <stdio.h>\n#include <stdarg.h>",
              1
          )

          # ============================================================
          # Kobo 4.45 compatibility:
          # remove fragile Nickel symbols and keep only the two which
          # are actually required to turn pages.
          #
          # Also add permanent debug logging and monotonic clock.
          # ============================================================

          start = "/* Stop Bluetooth heartbeat after this many seconds of inactivity */"
          end = "static void invokeMainWindowController"

          cc = replace_between(
              cc,
              start,
              end,
              """static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          static void debugLog(const char *fmt, ...)
          {
              FILE *f = fopen("/mnt/onboard/btpt-debug.txt", "a");

              if (!f) {
                  return;
              }

              va_list args;
              va_start(args, fmt);
              vfprintf(f, fmt, args);
              va_end(args);

              fputc('\\n', f);
              fflush(f);
              fclose(f);
          }

          static long long monotonicMilliseconds()
          {
              struct timespec ts;

              clock_gettime(CLOCK_MONOTONIC, &ts);

              return
                  ((long long)ts.tv_sec * 1000LL) +
                  ((long long)ts.tv_nsec / 1000000LL);
          }

          """
          )

          # ============================================================
          # Instrument page invocation itself.
          #
          # We want to know:
          # - requested method
          # - current Kobo view
          # - whether invokeMethod succeeded
          # ============================================================

          old = """\tQString name = cv->objectName();

          \tif (name != "ReadingView") {
          \t\treturn;
          \t}

          \tQMetaObject::invokeMethod(cv, method);"""

          new = """\tQString name = cv->objectName();

          \tdebugLog(
          \t\t"INVOKE request method='%s' view='%s'",
          \t\tmethod,
          \t\tname.toUtf8().constData()
          \t);

          \tif (name != "ReadingView") {
          \t\tdebugLog(
          \t\t\t"INVOKE SKIPPED method='%s' reason=not-reading-view",
          \t\t\tmethod
          \t\t);
          \t\treturn;
          \t}

          \tbool invoked = QMetaObject::invokeMethod(cv, method);

          \tdebugLog(
          \t\t"INVOKE result method='%s' success=%d",
          \t\tmethod,
          \t\tinvoked ? 1 : 0
          \t);"""

          assert old in cc, "Could not patch invokeMainWindowController"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Device acquisition diagnostics
          # ============================================================

          old = """{
          \tint fd;"""

          new = """{
          \tdebugLog(
          \t\t"addDevice name='%s' uniq='%s' handler='%s'",
          \t\tname.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\thandler.toUtf8().constData()
          \t);

          \tint fd;"""

          assert old in cc, "Could not patch addDevice start"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Log configuration file selected by kobo-btpt
          # ============================================================

          old = """\tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {"""

          new = """\tdebugLog(
          \t\t"trying config '%s'",
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {
          \t\tdebugLog(
          \t\t\t"CONFIG OPEN FAILED '%s'",
          \t\t\tcfg.fileName().toUtf8().constData()
          \t\t);"""

          assert old in cc, "Could not patch config open"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Log successful device acquisition
          # ============================================================

          old = """\tnh_log("acquired device %s: %s","""

          new = """\tdebugLog(
          \t\t"DEVICE ACQUIRED handler='%s' uniq='%s' config='%s'",
          \t\thandler.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tnh_log("acquired device %s: %s","""

          assert old in cc, "Could not patch device acquisition log"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Input-device scanning diagnostics
          # ============================================================

          old = """\tnh_log("checking /proc/bus/input/devices for new devices");"""

          new = """\tnh_log("checking /proc/bus/input/devices for new devices");
          \tdebugLog("SCAN /proc/bus/input/devices");"""

          assert old in cc, "Could not patch scan log"
          cc = cc.replace(old, new, 1)

          old = """\t\telse if (type == "H") {
          \t\t\t/* Skip if not Bluetooth device */"""

          new = """\t\telse if (type == "H") {
          \t\t\tdebugLog(
          \t\t\t\t"INPUT i='%s' name='%s' uniq='%s' handlers='%s'",
          \t\t\t\ti.toUtf8().constData(),
          \t\t\t\tn.toUtf8().constData(),
          \t\t\t\tu.toUtf8().constData(),
          \t\t\t\tline.toUtf8().constData()
          \t\t\t);

          \t\t\t/* Skip if not Bluetooth device */"""

          assert old in cc, "Could not patch input scan details"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Simplify run() and introduce single/double-click state.
          #
          # 300 ms window:
          #
          # first click
          #   -> pending
          #
          # no second click before deadline
          #   -> nextPage
          #
          # second click before deadline
          #   -> prevPage
          # ============================================================

          start = "void BluetoothPageTurner::run()\n{"
          end = '\tnh_log("starting");'

          cc = replace_between(
              cc,
              start,
              end,
              """void BluetoothPageTurner::run()
          {
              fd_set rfds;
              struct timeval tv;

              bool pendingSingleClick = false;
              long long singleClickDeadline = 0;

              const long long DOUBLE_CLICK_MS = 300;

          """
          )

          # ============================================================
          # Initial device scan.
          #
          # This is the fix which allows devices which are already
          # connected when the thread starts to be detected.
          # ============================================================

          old = 'watcher.addPath("/dev/input");'

          new = '''watcher.addPath("/dev/input");

              debugLog("watching /dev/input");
              debugLog("performing initial device scan");

              scanDevices();'''

          assert old in cc, "Could not patch initial scan"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Remove BluetoothHeartbeat section
          # ============================================================

          start = "\t\t/* Bluetooth heartbeat to prevent Bluetooth from turning off */"
          end = "\t\t/* Poll devices for input events */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ============================================================
          # Dynamic select() timeout for pending single click.
          #
          # Important:
          # select() must wake at the 300 ms deadline, otherwise a
          # single click could sit pending for the old 1 second timeout.
          # ============================================================

          old = """\t\ttv.tv_sec = 1;
          \t\ttv.tv_usec = 0;"""

          new = """\t\tlong long nowMs = monotonicMilliseconds();

          \t\tif (pendingSingleClick &&
          \t\t    nowMs >= singleClickDeadline) {

          \t\t\tdebugLog(
          \t\t\t\t"SINGLEDOUBLE timeout -> nextPage"
          \t\t\t);

          \t\t\tpendingSingleClick = false;

          \t\t\tinvokeMainWindowController("nextPage");
          \t\t}

          \t\tif (pendingSingleClick) {
          \t\t\tlong long remaining =
          \t\t\t\tsingleClickDeadline -
          \t\t\t\tmonotonicMilliseconds();

          \t\t\tif (remaining < 0) {
          \t\t\t\tremaining = 0;
          \t\t\t}

          \t\t\tdebugLog(
          \t\t\t\t"SINGLEDOUBLE waiting remaining=%lldms",
          \t\t\t\tremaining
          \t\t\t);

          \t\t\ttv.tv_sec = remaining / 1000;
          \t\t\ttv.tv_usec =
          \t\t\t\t(remaining % 1000) * 1000;
          \t\t}
          \t\telse {
          \t\t\ttv.tv_sec = 1;
          \t\t\ttv.tv_usec = 0;
          \t\t}"""

          assert old in cc, "Could not patch select timeout"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Remove obsolete heartbeat/PowerManager code from event path
          # ============================================================

          start = "\t\t\t\t\t/* Update Bluetooth heartbeat time */"
          end = "\t\t\t\t\t/* Invoke the configured method */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ============================================================
          # Permanent raw event logging
          # ============================================================

          old = """\t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          new = """\t\t\tdebugLog(
          \t\t\t\t"EVENT type=%u code=%u value=%d",
          \t\t\t\t(unsigned)e.type,
          \t\t\t\t(unsigned)e.code,
          \t\t\t\t(int)e.value
          \t\t\t);

          \t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          assert old in cc, "Could not patch raw event logging"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Implement special singleDouble action.
          #
          # Normal actions such as nextPage/prevPage continue working.
          # ============================================================

          old = """\t\t\t\t\tconst char *method = pair.second
          \t\t\t\t\t\t.toStdString().c_str();
          \t\t\t\t\tinvokeMainWindowController(method);"""

          new = """\t\t\t\t\tQByteArray method =
          \t\t\t\t\t\tpair.second.toUtf8();

          \t\t\t\t\tdebugLog(
          \t\t\t\t\t\t"MATCH method='%s' type=%u code=%u value=%d",
          \t\t\t\t\t\tmethod.constData(),
          \t\t\t\t\t\t(unsigned)e.type,
          \t\t\t\t\t\t(unsigned)e.code,
          \t\t\t\t\t\t(int)e.value
          \t\t\t\t\t);

          \t\t\t\t\tif (method == "singleDouble") {

          \t\t\t\t\t\tlong long clickTime =
          \t\t\t\t\t\t\tmonotonicMilliseconds();

          \t\t\t\t\t\tif (
          \t\t\t\t\t\t\tpendingSingleClick &&
          \t\t\t\t\t\t\tclickTime <= singleClickDeadline
          \t\t\t\t\t\t) {
          \t\t\t\t\t\t\tlong long elapsed =
          \t\t\t\t\t\t\t\tclickTime -
          \t\t\t\t\t\t\t\t(singleClickDeadline -
          \t\t\t\t\t\t\t\t DOUBLE_CLICK_MS);

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE second click elapsed=%lldms -> prevPage",
          \t\t\t\t\t\t\t\telapsed
          \t\t\t\t\t\t\t);

          \t\t\t\t\t\t\tpendingSingleClick = false;
          \t\t\t\t\t\t\tsingleClickDeadline = 0;

          \t\t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\t\t"prevPage"
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t\telse {
          \t\t\t\t\t\t\tpendingSingleClick = true;

          \t\t\t\t\t\t\tsingleClickDeadline =
          \t\t\t\t\t\t\t\tclickTime +
          \t\t\t\t\t\t\t\tDOUBLE_CLICK_MS;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE first click deadline=%lld",
          \t\t\t\t\t\t\t\tsingleClickDeadline
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t\telse {
          \t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t"NORMAL method='%s'",
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);

          \t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);
          \t\t\t\t\t}"""

          assert old in cc, "Could not patch method invocation"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # Remove TimeLastUsedUpdater implementation
          # ============================================================

          start = "void TimeLastUsedUpdater::notify()"
          end = "static int btpt_init()"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ============================================================
          # Minimal Kobo 4.45 init + PERMANENT DEBUG
          # ============================================================

          start = "static int btpt_init()"
          end = "static struct nh_info btpt_info"

          cc = replace_between(
              cc,
              start,
              end,
              """static int btpt_init()
          {
              mkdir(BTPT_DIR, 0755);

              /*
               * Reset debug log every Nickel startup.
               */
              FILE *debug =
                  fopen("/mnt/onboard/btpt-debug.txt", "w");

              if (debug) {
                  fputs(
                      "=== kobo-btpt single-double debug v2 ===\\n",
                      debug
                  );
                  fclose(debug);
              }

              debugLog("btpt_init reached");
              debugLog("BUILD single-double-debug-v2");
              debugLog("DOUBLE_CLICK_MS=300");

              /*
               * Human-readable build marker.
               */
              FILE *marker =
                  fopen("/mnt/onboard/btpt-loaded.txt", "w");

              if (marker) {
                  fputs(
                      "kobo-btpt single-double-debug-v2\\n",
                      marker
                  );
                  fclose(marker);
              }

              BluetoothPageTurner *btpt =
                  new BluetoothPageTurner();

              QObject::connect(
                  btpt,
                  &QThread::finished,
                  btpt,
                  &QObject::deleteLater
              );

              btpt->start();

              debugLog(
                  "BluetoothPageTurner thread started"
              );

              return 0;
          }

          """
          )

          # ============================================================
          # Keep only MainWindowController dlsym symbols
          # ============================================================

          start = "static struct nh_dlsym btpt_dlsym[] = {"
          end = "NickelHook("

          cc = replace_between(
              cc,
              start,
              end,
              """static struct nh_dlsym btpt_dlsym[] = {
              {
                  .name =
                      "_ZN20MainWindowController14sharedInstanceEv",
                  .out =
                      nh_symoutptr(
                          MainWindowController_sharedInstance
                      )
              },
              {
                  .name =
                      "_ZNK20MainWindowController11currentViewEv",
                  .out =
                      nh_symoutptr(
                          MainWindowController_currentView
                      )
              },
              {0},
          };

          """
          )

          # ============================================================
          # Simplify header for Kobo 4.45 compatibility
          # ============================================================

          start = "class BluetoothPageTurner : public QThread"
          end = "#endif /* BTPT_H */"

          h = replace_between(
              h,
              start,
              end,
              """class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler);
              bool scanDevices();
              void learn(Device &device);

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;
              QMutex mutex;
              QWaitCondition newDevice;
              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          """
          )

          # ============================================================
          # Write patched source
          # ============================================================

          cc_path.write_text(cc)
          h_path.write_text(h)

          # ============================================================
          # Build-time verification
          # ============================================================

          print("=== Checking patch ===")

          forbidden = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
              "last_event",
              "bluetoothHeartbeat",
          ]

          for item in forbidden:
              print(
                  item,
                  "FOUND" if item in cc else "removed"
              )
              assert item not in cc

          assert "debugLog" in cc
          assert "btpt-debug.txt" in cc

          assert "singleDouble" in cc
          assert "DOUBLE_CLICK_MS = 300" in cc

          assert (
              'invokeMainWindowController("nextPage")'
              in cc
          )

          assert '"prevPage"' in cc

          assert (
              "SINGLEDOUBLE first click"
              in cc
          )

          assert (
              "SINGLEDOUBLE second click"
              in cc
          )

          assert (
              "SINGLEDOUBLE timeout -> nextPage"
              in cc
          )

          assert (
              "EVENT type=%u code=%u value=%d"
              in cc
          )

          assert (
              "INVOKE result"
              in cc
          )

          assert "TimeLastUsedUpdater" not in h
          assert "void notify();" not in h

          print("Kobo 4.45 compatibility: OK")
          print("Initial Bluetooth scan: OK")
          print("Permanent debug: OK")
          print("Raw event logging: OK")
          print("Invocation logging: OK")
          print("single click -> nextPage: OK")
          print("double click -> prevPage: OK")
          print("double-click window: 300 ms")
          print("PATCH OK")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i \
            's|<linux/input-event-codes.h>|"input-event-codes.h"|' \
            src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-single-double-debug-v2
          path: KoboRoot.tgz
