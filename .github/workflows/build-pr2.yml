name: Build kobo-btpt single-double debug v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout known kobo-btpt source
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: be1f775
          submodules: recursive

      - name: Patch Kobo 4.45 single-double permanent debug
        shell: python
        run: |
          from pathlib import Path

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          def replace_between(text, start, end, replacement):
              assert start in text, f"START marker not found: {start}"
              a = text.index(start)

              assert end in text[a:], f"END marker not found: {end}"
              b = text.index(end, a)

              return text[:a] + replacement + text[b:]

          print("Source loaded:")
          print("  btpt.cc bytes:", len(cc))
          print("  btpt.h bytes:", len(h))

          # ============================================================
          # 1. DEBUG INCLUDE
          # ============================================================

          assert "#include <stdio.h>" in cc

          cc = cc.replace(
              "#include <stdio.h>",
              "#include <stdio.h>\n#include <stdarg.h>",
              1
          )

          # ============================================================
          # 2. KOBO 4.45 COMPATIBILITY + DEBUG FUNCTIONS
          #
          # Remove:
          #   BluetoothHeartbeat
          #   PowerManager
          #   TimeEvent
          #
          # Keep only MainWindowController symbols.
          # ============================================================

          cc = replace_between(
              cc,
              "/* Stop Bluetooth heartbeat after this many seconds of inactivity */",
              "static void invokeMainWindowController",
              r'''static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          static void debugLog(const char *fmt, ...)
          {
              FILE *f = fopen("/mnt/onboard/btpt-debug.txt", "a");

              if (!f) {
                  return;
              }

              va_list args;
              va_start(args, fmt);
              vfprintf(f, fmt, args);
              va_end(args);

              fputc('\n', f);
              fflush(f);
              fclose(f);
          }

          static long long monotonicMilliseconds()
          {
              struct timespec ts;

              clock_gettime(CLOCK_MONOTONIC, &ts);

              return
                  ((long long)ts.tv_sec * 1000LL) +
                  ((long long)ts.tv_nsec / 1000000LL);
          }

          '''
          )

          # ============================================================
          # 3. REPLACE ENTIRE PAGE INVOCATION FUNCTION
          #
          # Permanent debug:
          #   requested method
          #   current view
          #   invokeMethod result
          # ============================================================

          cc = replace_between(
              cc,
              "static void invokeMainWindowController(const char *method)",
              "bool BluetoothPageTurner::addDevice(",
              r'''static void invokeMainWindowController(const char *method)
          {
              void *mwc = MainWindowController_sharedInstance();

              if (!mwc) {
                  debugLog(
                      "INVOKE FAILED method='%s' reason=no-MainWindowController",
                      method
                  );
                  return;
              }

              QWidget *cv = MainWindowController_currentView(mwc);

              if (!cv) {
                  debugLog(
                      "INVOKE FAILED method='%s' reason=no-current-view",
                      method
                  );
                  return;
              }

              QString viewName = cv->objectName();

              debugLog(
                  "INVOKE request method='%s' view='%s'",
                  method,
                  viewName.toUtf8().constData()
              );

              if (viewName != "ReadingView") {
                  debugLog(
                      "INVOKE SKIPPED method='%s' reason=not-reading-view",
                      method
                  );
                  return;
              }

              bool result = QMetaObject::invokeMethod(
                  cv,
                  method,
                  Qt::QueuedConnection
              );

              debugLog(
                  "INVOKE result method='%s' success=%d",
                  method,
                  result ? 1 : 0
              );
          }

          '''
          )

          # ============================================================
          # 4. ADD DEVICE DEBUG
          # ============================================================

          marker = """bool BluetoothPageTurner::addDevice(
          \tconst QString &name, const QString &uniq, const QString &handler)
          {
          \tint fd;"""

          replacement = """bool BluetoothPageTurner::addDevice(
          \tconst QString &name, const QString &uniq, const QString &handler)
          {
          \tdebugLog(
          \t\t"addDevice name='%s' uniq='%s' handler='%s'",
          \t\tname.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\thandler.toUtf8().constData()
          \t);

          \tint fd;"""

          assert marker in cc, "addDevice marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 5. CONFIG FILE DEBUG
          # ============================================================

          marker = """\tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {"""

          replacement = """\tdebugLog(
          \t\t"trying config '%s'",
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {
          \t\tdebugLog(
          \t\t\t"CONFIG OPEN FAILED '%s'",
          \t\t\tcfg.fileName().toUtf8().constData()
          \t\t);"""

          assert marker in cc, "config open marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 6. DEVICE ACQUIRED DEBUG
          # ============================================================

          marker = """\tnh_log("acquired device %s: %s","""

          replacement = """\tdebugLog(
          \t\t"DEVICE ACQUIRED handler='%s' uniq='%s' config='%s'",
          \t\thandler.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tnh_log("acquired device %s: %s","""

          assert marker in cc, "device acquired marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 7. SCAN DEBUG
          # ============================================================

          marker = '\tnh_log("checking /proc/bus/input/devices for new devices");'

          replacement = """\tnh_log("checking /proc/bus/input/devices for new devices");
          \tdebugLog("SCAN /proc/bus/input/devices");"""

          assert marker in cc, "scan marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 8. LOG EVERY INPUT DEVICE ENTRY
          # ============================================================

          marker = """\t\telse if (type == "H") {
          \t\t\t/* Skip if not Bluetooth device */"""

          replacement = """\t\telse if (type == "H") {
          \t\t\tdebugLog(
          \t\t\t\t"INPUT i='%s' name='%s' uniq='%s' handlers='%s'",
          \t\t\t\ti.toUtf8().constData(),
          \t\t\t\tn.toUtf8().constData(),
          \t\t\t\tu.toUtf8().constData(),
          \t\t\t\tline.toUtf8().constData()
          \t\t\t);

          \t\t\t/* Skip if not Bluetooth device */"""

          assert marker in cc, "input handler marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 9. REPLACE RUN() LOCAL STATE
          #
          # DOUBLE_CLICK_MS = 300
          # ============================================================

          cc = replace_between(
              cc,
              "void BluetoothPageTurner::run()\n{",
              '\tnh_log("starting");',
              """void BluetoothPageTurner::run()
          {
          \tfd_set rfds;
          \tstruct timeval tv;

          \tbool pendingSingleClick = false;
          \tlong long firstClickTime = 0;
          \tlong long singleClickDeadline = 0;

          \tconst long long DOUBLE_CLICK_MS = 300;

          """
          )

          # ============================================================
          # 10. INITIAL SCAN FIX
          #
          # This is the fix already proven necessary on your Kobo.
          # ============================================================

          marker = 'watcher.addPath("/dev/input");'

          replacement = '''watcher.addPath("/dev/input");

          \tdebugLog("watching /dev/input");
          \tdebugLog("performing initial device scan");

          \tscanDevices();'''

          assert marker in cc, "watcher marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 11. REMOVE OLD BLUETOOTH HEARTBEAT
          # ============================================================

          cc = replace_between(
              cc,
              "\t\t/* Bluetooth heartbeat to prevent Bluetooth from turning off */",
              "\t\t/* Poll devices for input events */",
              ""
          )

          # ============================================================
          # 12. SELECT TIMEOUT + SINGLE-CLICK TIMEOUT
          #
          # After first click, select() waits only until the
          # 300 ms deadline.
          #
          # If deadline expires:
          #     nextPage
          # ============================================================

          marker = """\t\ttv.tv_sec = 1;
          \t\ttv.tv_usec = 0;"""

          replacement = """\t\tlong long nowMs = monotonicMilliseconds();

          \t\tif (
          \t\t\tpendingSingleClick &&
          \t\t\tnowMs >= singleClickDeadline
          \t\t) {
          \t\t\tlong long elapsed =
          \t\t\t\tnowMs - firstClickTime;

          \t\t\tdebugLog(
          \t\t\t\t"SINGLEDOUBLE timeout elapsed=%lldms -> nextPage",
          \t\t\t\telapsed
          \t\t\t);

          \t\t\tpendingSingleClick = false;
          \t\t\tfirstClickTime = 0;
          \t\t\tsingleClickDeadline = 0;

          \t\t\tinvokeMainWindowController("nextPage");
          \t\t}

          \t\tif (pendingSingleClick) {
          \t\t\tlong long remaining =
          \t\t\t\tsingleClickDeadline -
          \t\t\t\tmonotonicMilliseconds();

          \t\t\tif (remaining < 0) {
          \t\t\t\tremaining = 0;
          \t\t\t}

          \t\t\ttv.tv_sec =
          \t\t\t\tremaining / 1000;

          \t\t\ttv.tv_usec =
          \t\t\t\t(remaining % 1000) * 1000;
          \t\t}
          \t\telse {
          \t\t\ttv.tv_sec = 1;
          \t\t\ttv.tv_usec = 0;
          \t\t}"""

          assert marker in cc, "select timeout marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 13. RAW EVENT DEBUG
          # ============================================================

          marker = """\t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          replacement = """\t\t\tdebugLog(
          \t\t\t\t"EVENT type=%u code=%u value=%d",
          \t\t\t\t(unsigned)e.type,
          \t\t\t\t(unsigned)e.code,
          \t\t\t\t(int)e.value
          \t\t\t);

          \t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          assert marker in cc, "raw event marker not found"
          cc = cc.replace(marker, replacement, 1)

          # ============================================================
          # 14. REPLACE EVENT MATCH BODY
          #
          # Config:
          #
          # singleDouble EV_KEY KEY_VOLUMEUP 1
          #
          # First click:
          #     wait up to 300 ms
          #
          # Second click:
          #     prevPage
          #
          # Timeout:
          #     nextPage
          #
          # Normal kobo-btpt methods still work too.
          # ============================================================

          match_start = """\t\t\t\tif (e.type == test.type &&
          \t\t\t\t    e.code == test.code &&
          \t\t\t\t    e.value == test.value) {"""

          match_end = """\t\t\t\t}
          \t\t\t}"""

          assert match_start in cc, "event match start not found"

          a = cc.index(match_start)
          b = cc.index(match_end, a)

          replacement = """\t\t\t\tif (e.type == test.type &&
          \t\t\t\t    e.code == test.code &&
          \t\t\t\t    e.value == test.value) {

          \t\t\t\t\tQByteArray method =
          \t\t\t\t\t\tpair.second.toUtf8();

          \t\t\t\t\tdebugLog(
          \t\t\t\t\t\t"MATCH method='%s' type=%u code=%u value=%d",
          \t\t\t\t\t\tmethod.constData(),
          \t\t\t\t\t\t(unsigned)e.type,
          \t\t\t\t\t\t(unsigned)e.code,
          \t\t\t\t\t\t(int)e.value
          \t\t\t\t\t);

          \t\t\t\t\tif (method == "singleDouble") {

          \t\t\t\t\t\tlong long clickTime =
          \t\t\t\t\t\t\tmonotonicMilliseconds();

          \t\t\t\t\t\t/*
          \t\t\t\t\t\t * If an old first click has already
          \t\t\t\t\t\t * expired, commit it as nextPage
          \t\t\t\t\t\t * before treating this as a new click.
          \t\t\t\t\t\t */
          \t\t\t\t\t\tif (
          \t\t\t\t\t\t\tpendingSingleClick &&
          \t\t\t\t\t\t\tclickTime > singleClickDeadline
          \t\t\t\t\t\t) {
          \t\t\t\t\t\t\tlong long elapsed =
          \t\t\t\t\t\t\t\tclickTime - firstClickTime;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE expired first click elapsed=%lldms -> nextPage",
          \t\t\t\t\t\t\t\telapsed
          \t\t\t\t\t\t\t);

          \t\t\t\t\t\t\tpendingSingleClick = false;
          \t\t\t\t\t\t\tfirstClickTime = 0;
          \t\t\t\t\t\t\tsingleClickDeadline = 0;

          \t\t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\t\t"nextPage"
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}

          \t\t\t\t\t\t/*
          \t\t\t\t\t\t * Second click inside the window.
          \t\t\t\t\t\t */
          \t\t\t\t\t\tif (pendingSingleClick) {
          \t\t\t\t\t\t\tlong long elapsed =
          \t\t\t\t\t\t\t\tclickTime - firstClickTime;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE second click elapsed=%lldms -> prevPage",
          \t\t\t\t\t\t\t\telapsed
          \t\t\t\t\t\t\t);

          \t\t\t\t\t\t\tpendingSingleClick = false;
          \t\t\t\t\t\t\tfirstClickTime = 0;
          \t\t\t\t\t\t\tsingleClickDeadline = 0;

          \t\t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\t\t"prevPage"
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t\telse {
          \t\t\t\t\t\t\t/*
          \t\t\t\t\t\t\t * First click.
          \t\t\t\t\t\t\t */
          \t\t\t\t\t\t\tpendingSingleClick = true;

          \t\t\t\t\t\t\tfirstClickTime =
          \t\t\t\t\t\t\t\tclickTime;

          \t\t\t\t\t\t\tsingleClickDeadline =
          \t\t\t\t\t\t\t\tclickTime +
          \t\t\t\t\t\t\t\tDOUBLE_CLICK_MS;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE first click window=%lldms",
          \t\t\t\t\t\t\t\tDOUBLE_CLICK_MS
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t\telse {
          \t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t"NORMAL method='%s'",
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);

          \t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);
          \t\t\t\t\t}
          """

          cc = (
              cc[:a] +
              replacement +
              cc[b:]
          )

          # ============================================================
          # 15. REMOVE TimeLastUsedUpdater
          # ============================================================

          cc = replace_between(
              cc,
              "void TimeLastUsedUpdater::notify()",
              "static int btpt_init()",
              ""
          )

          # ============================================================
          # 16. INIT + PERMANENT DEBUG
          # ============================================================

          cc = replace_between(
              cc,
              "static int btpt_init()",
              "static struct nh_info btpt_info",
              """static int btpt_init()
          {
          \tmkdir(BTPT_DIR, 0755);

          \tFILE *debug =
          \t\tfopen("/mnt/onboard/btpt-debug.txt", "w");

          \tif (debug) {
          \t\tfputs(
          \t\t\t"=== kobo-btpt single-double debug v4 ===\\n",
          \t\t\tdebug
          \t\t);
          \t\tfclose(debug);
          \t}

          \tdebugLog("btpt_init reached");
          \tdebugLog("BUILD single-double-debug-v4");
          \tdebugLog("DOUBLE_CLICK_MS=300");

          \tFILE *marker =
          \t\tfopen("/mnt/onboard/btpt-loaded.txt", "w");

          \tif (marker) {
          \t\tfputs(
          \t\t\t"kobo-btpt single-double-debug-v4\\n",
          \t\t\tmarker
          \t\t);
          \t\tfclose(marker);
          \t}

          \tBluetoothPageTurner *btpt =
          \t\tnew BluetoothPageTurner();

          \tQObject::connect(
          \t\tbtpt,
          \t\t&QThread::finished,
          \t\tbtpt,
          \t\t&QObject::deleteLater
          \t);

          \tbtpt->start();

          \tdebugLog(
          \t\t"BluetoothPageTurner thread started"
          \t);

          \treturn 0;
          }

          """
          )

          # ============================================================
          # 17. ONLY TWO REQUIRED NICKEL SYMBOLS
          # ============================================================

          cc = replace_between(
              cc,
              "static struct nh_dlsym btpt_dlsym[] = {",
              "NickelHook(",
              """static struct nh_dlsym btpt_dlsym[] = {
          \t{
          \t\t.name =
          \t\t\t"_ZN20MainWindowController14sharedInstanceEv",
          \t\t.out =
          \t\t\tnh_symoutptr(
          \t\t\t\tMainWindowController_sharedInstance
          \t\t\t)
          \t},
          \t{
          \t\t.name =
          \t\t\t"_ZNK20MainWindowController11currentViewEv",
          \t\t.out =
          \t\t\tnh_symoutptr(
          \t\t\t\tMainWindowController_currentView
          \t\t\t)
          \t},
          \t{0},
          };

          """
          )

          # ============================================================
          # 18. HEADER — REMOVE TimeLastUsedUpdater / notify
          # ============================================================

          h = replace_between(
              h,
              "class BluetoothPageTurner : public QThread",
              "#endif /* BTPT_H */",
              """class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler
              );

              bool scanDevices();
              void learn(Device &device);

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;
              QMutex mutex;
              QWaitCondition newDevice;
              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          """
          )

          # ============================================================
          # 19. WRITE PATCHED SOURCE
          # ============================================================

          cc_path.write_text(cc)
          h_path.write_text(h)

          # ============================================================
          # 20. VALIDATE EXACT GENERATED SOURCE
          #
          # These strings are now deliberately single C++ literals.
          # No adjacent-string mismatch like v3.
          # ============================================================

          print("=== VERIFY PATCH V4 ===")

          forbidden_cc = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
              "last_event",
              "bluetoothHeartbeat",
          ]

          for item in forbidden_cc:
              assert item not in cc, f"Forbidden symbol remains: {item}"
              print("removed:", item)

          forbidden_h = [
              "TimeLastUsedUpdater",
              "void notify();",
          ]

          for item in forbidden_h:
              assert item not in h, f"Forbidden header symbol remains: {item}"
              print("removed from header:", item)

          required = [
              'if (method == "singleDouble")',
              "const long long DOUBLE_CLICK_MS = 300;",
              "SINGLEDOUBLE first click window=%lldms",
              "SINGLEDOUBLE second click elapsed=%lldms -> prevPage",
              "SINGLEDOUBLE timeout elapsed=%lldms -> nextPage",
              "SINGLEDOUBLE expired first click elapsed=%lldms -> nextPage",
              'invokeMainWindowController("nextPage");',
              '"prevPage"',
              "/mnt/onboard/btpt-debug.txt",
              "EVENT type=%u code=%u value=%d",
              "MATCH method='%s' type=%u code=%u value=%d",
              "INVOKE request method='%s' view='%s'",
              "INVOKE result method='%s' success=%d",
              "performing initial device scan",
              "single-double-debug-v4",
          ]

          for item in required:
              assert item in cc, f"Required code missing: {item}"
              print("OK:", item)

          # Make sure braces were not obviously damaged.
          open_braces = cc.count("{")
          close_braces = cc.count("}")

          print("C++ braces:", open_braces, close_braces)

          assert open_braces == close_braces, (
              f"Unbalanced braces: {open_braces} != {close_braces}"
          )

          print("")
          print("Permanent debug: OK")
          print("Kobo 4.45 compatibility: OK")
          print("Initial device scan: OK")
          print("Single click -> nextPage: OK")
          print("Double click -> prevPage: OK")
          print("Expired-click handling: OK")
          print("Double-click window: 300 ms")
          print("SOURCE PATCH V4 VERIFIED")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i \
            's|<linux/input-event-codes.h>|"input-event-codes.h"|' \
            src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          echo "=== BUILD RESULT ==="
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz
          echo "KoboRoot.tgz OK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-single-double-debug-v4
          path: KoboRoot.tgz
