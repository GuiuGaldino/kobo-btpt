name: Build kobo-btpt PR32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1 \
            -lc '
              SYSROOT="$(arm-nickel-linux-gnueabihf-g++ -print-sysroot)"
              echo "Nickel sysroot: $SYSROOT"
              mkdir -p "$SYSROOT/usr/include/linux"
              cp /usr/include/linux/input-event-codes.h "$SYSROOT/usr/include/linux/input-event-codes.h"
              make clean all koboroot
            '

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-pr32
          path: KoboRoot.tgz
