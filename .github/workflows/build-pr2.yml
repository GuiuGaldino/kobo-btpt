name: Build kobo-btpt 4.45 fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR32
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Patch for Kobo 4.45
        shell: python
        run: |
          from pathlib import Path

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          # Remove fragile private Nickel symbol declarations.
          start = "/* Stop Bluetooth heartbeat after this many seconds of inactivity */"
          end = "static void invokeMainWindowController"

          cc = replace_between(
              cc,
              start,
              end,
              """static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          """
          )

          # Simplify the start of BluetoothPageTurner::run().
          start = "void BluetoothPageTurner::run()\n{"
          end = '\tnh_log("starting");'

          cc = replace_between(
              cc,
              start,
              end,
              """void BluetoothPageTurner::run()
          {
              fd_set rfds;
              struct timeval tv;

          """
          )

          # Remove Bluetooth heartbeat block.
          start = "\t\t/* Bluetooth heartbeat to prevent Bluetooth from turning off */"
          end = "\t\t/* Poll devices for input events */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # Remove heartbeat timestamp / PowerManager handling.
          start = "\t\t\t\t\t/* Update Bluetooth heartbeat time */"
          end = "\t\t\t\t\t/* Invoke the configured method */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # Fix temporary c_str pointer.
          old = """\t\t\t\t\tconst char *method = pair.second
          \t\t\t\t\t\t.toStdString().c_str();
          \t\t\t\t\tinvokeMainWindowController(method);"""

          new = """\t\t\t\t\tQByteArray method = pair.second.toUtf8();
          \t\t\t\t\tinvokeMainWindowController(method.constData());"""

          cc = cc.replace(old, new)

          # Remove TimeLastUsedUpdater implementation.
          start = "void TimeLastUsedUpdater::notify()"
          end = "static int btpt_init()"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # Replace btpt_init with minimal diagnostic init.
          start = "static int btpt_init()"
          end = "static struct nh_info btpt_info"

          cc = replace_between(
              cc,
              start,
              end,
              """static int btpt_init()
          {
              mkdir(BTPT_DIR, 0755);

              FILE *marker = fopen("/mnt/onboard/btpt-loaded.txt", "w");
              if (marker) {
                  fputs("kobo-btpt init reached\\n", marker);
                  fclose(marker);
              }

              BluetoothPageTurner *btpt = new BluetoothPageTurner();

              QObject::connect(
                  btpt,
                  &QThread::finished,
                  btpt,
                  &QObject::deleteLater
              );

              btpt->start();

              return 0;
          }

          """
          )

          # Keep only MainWindowController symbols.
          start = "static struct nh_dlsym btpt_dlsym[] = {"
          end = "NickelHook("

          cc = replace_between(
              cc,
              start,
              end,
              """static struct nh_dlsym btpt_dlsym[] = {
              {
                  .name = "_ZN20MainWindowController14sharedInstanceEv",
                  .out = nh_symoutptr(MainWindowController_sharedInstance)
              },
              {
                  .name = "_ZNK20MainWindowController11currentViewEv",
                  .out = nh_symoutptr(MainWindowController_currentView)
              },
              {0},
          };

          """
          )

          # Simplify header.
          start = "class BluetoothPageTurner : public QThread"
          end = "#endif /* BTPT_H */"

          h = replace_between(
              h,
              start,
              end,
              """class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler);
              bool scanDevices();
              void learn(Device &device);

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;
              QMutex mutex;
              QWaitCondition newDevice;
              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          """
          )

          # Fix startup bug: scan devices which are already connected.
          old = 'watcher.addPath("/dev/input");'
          new = '''watcher.addPath("/dev/input");

              /* Scan devices which were already connected at startup */
              scanDevices();'''

          assert old in cc, "Could not find watcher.addPath"
          cc = cc.replace(old, new, 1)

          cc_path.write_text(cc)
          h_path.write_text(h)

          print("=== Checking patch ===")

          forbidden_cc = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
              "last_event",
              "bluetoothHeartbeat",
          ]

          for item in forbidden_cc:
              if item in cc:
                  print(item, "FOUND")
              else:
                  print(item, "removed")

          print(
              "marker:",
              "OK" if "btpt-loaded.txt" in cc else "MISSING"
          )

          print(
              "initial scan:",
              "OK" if "already connected at startup" in cc else "MISSING"
          )

          for item in forbidden_cc:
              assert item not in cc, f"Still present: {item}"

          assert "TimeLastUsedUpdater" not in h
          assert "void notify();" not in h
          assert "btpt-loaded.txt" in cc
          assert "already connected at startup" in cc

          print("Patch OK")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i 's|<linux/input-event-codes.h>|"input-event-codes.h"|' src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-445-fixed
          path: KoboRoot.tgz
