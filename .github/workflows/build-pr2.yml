name: Build kobo-btpt single-double debug v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kobo-btpt
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Install Kobo 4.45 single-double source
        shell: bash
        run: |
          cat > src/btpt.h <<'EOF'
          #ifndef BTPT_H
          #define BTPT_H

          #include <linux/input.h>
          #include <linux/uinput.h>

          #include <QFileSystemWatcher>
          #include <QList>
          #include <QMap>
          #include <QMutex>
          #include <QPair>
          #include <QThread>
          #include <QWaitCondition>

          class Device
          {
          public:
              int fd;
              QList<QPair<struct input_event, QString>> cfg;
          };

          class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler
              );

              bool scanDevices();

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;

              QMutex mutex;
              QWaitCondition newDevice;

              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          #endif /* BTPT_H */
          EOF

          cat > src/btpt.cc <<'EOF'
          #include <string.h>
          #include <stdio.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <time.h>
          #include <stdlib.h>
          #include <errno.h>
          #include <cstddef>
          #include <cstdlib>
          #include <sys/stat.h>

          #include <linux/uinput.h>

          #include <NickelHook.h>

          #include <QApplication>
          #include <QDir>
          #include <QFileSystemWatcher>
          #include <QFile>
          #include <QWidget>
          #include <QTextStream>
          #include <QThread>
          #include <QByteArray>

          #include "btpt.h"
          #include "eventcodes.h"

          #define BTPT_DIR "/mnt/onboard/.btpt/"

          static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          static void debugLog(const char *fmt, ...)
          {
              FILE *f = fopen(
                  "/mnt/onboard/btpt-debug.txt",
                  "a"
              );

              if (!f) {
                  return;
              }

              struct timespec ts;
              clock_gettime(CLOCK_MONOTONIC, &ts);

              fprintf(
                  f,
                  "[%lld.%03lld] ",
                  (long long)ts.tv_sec,
                  (long long)(ts.tv_nsec / 1000000LL)
              );

              va_list args;
              va_start(args, fmt);
              vfprintf(f, fmt, args);
              va_end(args);

              fputc('\n', f);
              fflush(f);
              fclose(f);
          }

          static long long monotonicMilliseconds()
          {
              struct timespec ts;

              clock_gettime(CLOCK_MONOTONIC, &ts);

              return
                  ((long long)ts.tv_sec * 1000LL) +
                  ((long long)ts.tv_nsec / 1000000LL);
          }

          static void invokeMainWindowController(
              const char *method
          )
          {
              debugLog(
                  "INVOKE begin method='%s'",
                  method
              );

              void *mwc =
                  MainWindowController_sharedInstance();

              if (!mwc) {
                  debugLog(
                      "INVOKE FAIL method='%s' reason=no-controller",
                      method
                  );
                  return;
              }

              QWidget *cv =
                  MainWindowController_currentView(mwc);

              if (!cv) {
                  debugLog(
                      "INVOKE FAIL method='%s' reason=no-view",
                      method
                  );
                  return;
              }

              QString viewName =
                  cv->objectName();

              debugLog(
                  "INVOKE method='%s' view='%s'",
                  method,
                  viewName.toUtf8().constData()
              );

              if (viewName != "ReadingView") {
                  debugLog(
                      "INVOKE SKIP method='%s' reason=not-reading-view",
                      method
                  );
                  return;
              }

              bool result =
                  QMetaObject::invokeMethod(
                      cv,
                      method,
                      Qt::QueuedConnection
                  );

              debugLog(
                  "INVOKE done method='%s' success=%d",
                  method,
                  result ? 1 : 0
              );
          }

          bool BluetoothPageTurner::addDevice(
              const QString &name,
              const QString &uniq,
              const QString &handler
          )
          {
              debugLog(
                  "ADD begin name='%s' uniq='%s' handler='%s'",
                  name.toUtf8().constData(),
                  uniq.toUtf8().constData(),
                  handler.toUtf8().constData()
              );

              if (devices.contains(uniq)) {
                  debugLog(
                      "ADD skip uniq='%s' reason=already-added",
                      uniq.toUtf8().constData()
                  );

                  return false;
              }

              /*
               * First try the Bluetooth name.
               */
              QFile cfg(BTPT_DIR + name);

              debugLog(
                  "ADD default-config='%s'",
                  cfg.fileName().toUtf8().constData()
              );

              /*
               * Bluetooth address config overrides name.
               */
              QStringList list =
                  QDir(BTPT_DIR).entryList();

              debugLog(
                  "ADD config-directory entries=%d",
                  list.size()
              );

              for (int i = 0; i < list.size(); ++i) {
                  QString filename =
                      list.at(i);

                  debugLog(
                      "ADD config-candidate='%s'",
                      filename.toUtf8().constData()
                  );

                  if (
                      filename.toLower() ==
                      uniq.toLower()
                  ) {
                      cfg.setFileName(
                          BTPT_DIR + filename
                      );

                      debugLog(
                          "ADD address-config-match='%s'",
                          cfg.fileName()
                              .toUtf8()
                              .constData()
                      );
                  }
              }

              debugLog(
                  "ADD opening-config='%s'",
                  cfg.fileName().toUtf8().constData()
              );

              if (
                  !cfg.open(
                      QIODevice::ReadOnly |
                      QIODevice::Text
                  )
              ) {
                  debugLog(
                      "ADD FAIL config-open path='%s' error='%s'",
                      cfg.fileName()
                          .toUtf8()
                          .constData(),
                      cfg.errorString()
                          .toUtf8()
                          .constData()
                  );

                  return false;
              }

              debugLog(
                  "ADD config-open OK path='%s'",
                  cfg.fileName().toUtf8().constData()
              );

              /*
               * Read config BEFORE touching event device.
               */
              QByteArray text =
                  cfg.readAll();

              cfg.close();

              debugLog(
                  "ADD config-read bytes=%d",
                  text.size()
              );

              /*
               * Print config contents safely.
               */
              QByteArray printable = text;
              printable.replace('\r', ' ');
              printable.replace('\n', '|');

              debugLog(
                  "ADD config-raw='%s'",
                  printable.constData()
              );

              /*
               * Parse config.
               */
              QList<QPair<struct input_event, QString>>
                  parsedConfig;

              QTextStream in(&text);

              int lineNumber = 0;

              while (!in.atEnd()) {
                  QString line =
                      in.readLine();

                  lineNumber++;

                  debugLog(
                      "CONFIG line=%d text='%s'",
                      lineNumber,
                      line.toUtf8().constData()
                  );

                  QList<QString> parts =
                      line.split(
                          " ",
                          QString::SkipEmptyParts
                      );

                  debugLog(
                      "CONFIG line=%d parts=%d",
                      lineNumber,
                      parts.size()
                  );

                  if (parts.size() != 4) {
                      debugLog(
                          "CONFIG FAIL line=%d reason=parts expected=4 actual=%d",
                          lineNumber,
                          parts.size()
                      );

                      return false;
                  }

                  debugLog(
                      "CONFIG line=%d method='%s' type='%s' code='%s' value='%s'",
                      lineNumber,
                      parts[0].toUtf8().constData(),
                      parts[1].toUtf8().constData(),
                      parts[2].toUtf8().constData(),
                      parts[3].toUtf8().constData()
                  );

                  struct input_event event = { 0 };

                  bool ok = false;

                  event.type =
                      parseEventCode(
                          &ok,
                          parts[1]
                      );

                  if (!ok) {
                      debugLog(
                          "CONFIG FAIL line=%d invalid-type='%s'",
                          lineNumber,
                          parts[1]
                              .toUtf8()
                              .constData()
                      );

                      return false;
                  }

                  debugLog(
                      "CONFIG line=%d parsed-type=%u",
                      lineNumber,
                      (unsigned)event.type
                  );

                  event.code =
                      parseEventCode(
                          &ok,
                          parts[2]
                      );

                  if (!ok) {
                      debugLog(
                          "CONFIG FAIL line=%d invalid-code='%s'",
                          lineNumber,
                          parts[2]
                              .toUtf8()
                              .constData()
                      );

                      return false;
                  }

                  debugLog(
                      "CONFIG line=%d parsed-code=%u",
                      lineNumber,
                      (unsigned)event.code
                  );

                  event.value =
                      parseEventCode(
                          &ok,
                          parts[3]
                      );

                  if (!ok) {
                      debugLog(
                          "CONFIG FAIL line=%d invalid-value='%s'",
                          lineNumber,
                          parts[3]
                              .toUtf8()
                              .constData()
                      );

                      return false;
                  }

                  debugLog(
                      "CONFIG line=%d parsed-value=%d",
                      lineNumber,
                      (int)event.value
                  );

                  QPair<
                      struct input_event,
                      QString
                  > map(
                      event,
                      parts[0]
                  );

                  parsedConfig.append(map);

                  debugLog(
                      "CONFIG line=%d OK method='%s'",
                      lineNumber,
                      parts[0]
                          .toUtf8()
                          .constData()
                  );
              }

              if (parsedConfig.empty()) {
                  debugLog(
                      "ADD FAIL reason=config-empty"
                  );

                  return false;
              }

              /*
               * Now open event device.
               */
              QString path =
                  "/dev/input/" + handler;

              debugLog(
                  "ADD opening-input='%s'",
                  path.toUtf8().constData()
              );

              errno = 0;

              int fd = open(
                  path.toStdString().c_str(),
                  O_RDONLY | O_NONBLOCK
              );

              if (fd < 0) {
                  debugLog(
                      "ADD FAIL input-open path='%s' errno=%d error='%s'",
                      path.toUtf8().constData(),
                      errno,
                      strerror(errno)
                  );

                  return false;
              }

              debugLog(
                  "ADD input-open OK fd=%d path='%s'",
                  fd,
                  path.toUtf8().constData()
              );

              Device &device =
                  devices[uniq];

              device.fd = fd;
              device.cfg = parsedConfig;

              debugLog(
                  "DEVICE ACQUIRED handler='%s' uniq='%s' config='%s' mappings=%d fd=%d",
                  handler.toUtf8().constData(),
                  uniq.toUtf8().constData(),
                  cfg.fileName()
                      .toUtf8()
                      .constData(),
                  device.cfg.size(),
                  fd
              );

              return true;
          }

          void BluetoothPageTurner::directoryChanged(
              const QString &path
          )
          {
              debugLog(
                  "DIRECTORY CHANGED path='%s'",
                  path.toUtf8().constData()
              );

              mutex.lock();

              deviceChanges++;

              debugLog(
                  "DIRECTORY CHANGED deviceChanges=%d",
                  deviceChanges
              );

              newDevice.wakeAll();

              mutex.unlock();
          }

          bool BluetoothPageTurner::scanDevices()
          {
              bool devicesAdded = false;

              debugLog(
                  "SCAN begin"
              );

              QFile file(
                  "/proc/bus/input/devices"
              );

              if (
                  !file.open(
                      QIODevice::ReadOnly |
                      QIODevice::Text
                  )
              ) {
                  debugLog(
                      "SCAN FAIL open /proc/bus/input/devices error='%s'",
                      file.errorString()
                          .toUtf8()
                          .constData()
                  );

                  return false;
              }

              QByteArray text =
                  file.readAll();

              file.close();

              QTextStream in(&text);

              QString i;
              QString u;
              QString n;

              while (!in.atEnd()) {
                  QString line =
                      in.readLine();

                  QString type =
                      line.section(
                          ": ",
                          0,
                          0
                      );

                  if (type == "I") {
                      i =
                          line.section(
                              ": ",
                              1
                          );
                  }
                  else if (type == "U") {
                      u =
                          line.section(
                              ": Uniq=",
                              1
                          );

                      u.remove(':');
                  }
                  else if (type == "N") {
                      n =
                          line.section(
                              ": Name=",
                              1
                          );

                      n.chop(1);
                      n.remove(0, 1);
                  }
                  else if (type == "H") {
                      debugLog(
                          "INPUT i='%s' name='%s' uniq='%s' handlers='%s'",
                          i.toUtf8().constData(),
                          n.toUtf8().constData(),
                          u.toUtf8().constData(),
                          line.toUtf8().constData()
                      );

                      if (
                          !i.startsWith(
                              "Bus=0005 "
                          )
                      ) {
                          continue;
                      }

                      QList<QString> handlers =
                          line
                              .section(
                                  "Handlers=",
                                  1
                              )
                              .split(" ");

                      foreach(
                          const QString &handler,
                          handlers
                      ) {
                          if (
                              handler.startsWith(
                                  "event"
                              )
                          ) {
                              debugLog(
                                  "SCAN Bluetooth event handler='%s'",
                                  handler
                                      .toUtf8()
                                      .constData()
                              );

                              bool added =
                                  addDevice(
                                      n,
                                      u,
                                      handler
                                  );

                              debugLog(
                                  "SCAN addDevice result=%d uniq='%s'",
                                  added ? 1 : 0,
                                  u.toUtf8().constData()
                              );

                              devicesAdded |= added;
                          }
                      }
                  }
              }

              debugLog(
                  "SCAN end added=%d device-count=%d",
                  devicesAdded ? 1 : 0,
                  devices.size()
              );

              return devicesAdded;
          }

          void BluetoothPageTurner::run()
          {
              fd_set rfds;
              struct timeval tv;

              bool pendingSingleClick = false;

              long long firstClickTime = 0;
              long long singleClickDeadline = 0;

              const long long DOUBLE_CLICK_MS =
                  300;

              debugLog(
                  "THREAD run begin"
              );

              QObject::connect(
                  &watcher,
                  &QFileSystemWatcher::directoryChanged,
                  this,
                  &BluetoothPageTurner::directoryChanged
              );

              bool watching =
                  watcher.addPath(
                      "/dev/input"
                  );

              debugLog(
                  "WATCH /dev/input result=%d",
                  watching ? 1 : 0
              );

              /*
               * Critical Kobo fix:
               * scan immediately.
               */
              debugLog(
                  "INITIAL SCAN begin"
              );

              scanDevices();

              debugLog(
                  "INITIAL SCAN finished device-count=%d",
                  devices.size()
              );

              while (1) {
                  struct input_event e;
                  int ret;

                  /*
                   * Process device changes.
                   */
                  mutex.lock();

                  if (
                      deviceChanges > 0
                  ) {
                      int changes =
                          deviceChanges;

                      deviceChanges = 0;

                      mutex.unlock();

                      debugLog(
                          "THREAD rescanning changes=%d",
                          changes
                      );

                      scanDevices();
                  }
                  else {
                      mutex.unlock();
                  }

                  /*
                   * Commit pending single click.
                   */
                  long long nowMs =
                      monotonicMilliseconds();

                  if (
                      pendingSingleClick &&
                      nowMs >= singleClickDeadline
                  ) {
                      long long elapsed =
                          nowMs -
                          firstClickTime;

                      debugLog(
                          "SINGLEDOUBLE timeout elapsed=%lldms -> nextPage",
                          elapsed
                      );

                      pendingSingleClick = false;
                      firstClickTime = 0;
                      singleClickDeadline = 0;

                      invokeMainWindowController(
                          "nextPage"
                      );
                  }

                  /*
                   * Nothing connected yet.
                   *
                   * Don't block forever: poll at one second
                   * so debugging always continues.
                   */
                  if (devices.empty()) {
                      debugLog(
                          "THREAD no devices; sleeping 1000ms"
                      );

                      QThread::msleep(1000);

                      scanDevices();

                      continue;
                  }

                  /*
                   * Calculate select timeout.
                   */
                  if (pendingSingleClick) {
                      long long remaining =
                          singleClickDeadline -
                          monotonicMilliseconds();

                      if (remaining < 0) {
                          remaining = 0;
                      }

                      tv.tv_sec =
                          remaining / 1000;

                      tv.tv_usec =
                          (remaining % 1000) *
                          1000;
                  }
                  else {
                      tv.tv_sec = 1;
                      tv.tv_usec = 0;
                  }

                  FD_ZERO(&rfds);

                  int maxfd = -1;

                  foreach(
                      const Device &device,
                      devices.values()
                  ) {
                      FD_SET(
                          device.fd,
                          &rfds
                      );

                      if (device.fd > maxfd) {
                          maxfd =
                              device.fd;
                      }
                  }

                  debugLog(
                      "SELECT begin devices=%d maxfd=%d pending=%d",
                      devices.size(),
                      maxfd,
                      pendingSingleClick ? 1 : 0
                  );

                  errno = 0;

                  ret = select(
                      maxfd + 1,
                      &rfds,
                      NULL,
                      NULL,
                      &tv
                  );

                  if (ret < 0) {
                      debugLog(
                          "SELECT FAIL errno=%d error='%s'",
                          errno,
                          strerror(errno)
                      );

                      continue;
                  }

                  if (ret == 0) {
                      /*
                       * Timeout is normal.
                       * Next loop commits pending click.
                       */
                      continue;
                  }

                  debugLog(
                      "SELECT ready=%d",
                      ret
                  );

                  /*
                   * Process devices.
                   */
                  for (
                      auto it = devices.begin();
                      it != devices.end();
                  ) {
                      Device &device =
                          it.value();

                      if (
                          !FD_ISSET(
                              device.fd,
                              &rfds
                          )
                      ) {
                          it++;
                          continue;
                      }

                      errno = 0;

                      ret = read(
                          device.fd,
                          &e,
                          sizeof(e)
                      );

                      if (
                          ret <
                          (int)sizeof(e)
                      ) {
                          debugLog(
                              "DEVICE LOST fd=%d read=%d errno=%d error='%s'",
                              device.fd,
                              ret,
                              errno,
                              strerror(errno)
                          );

                          close(device.fd);

                          it =
                              devices.erase(it);

                          continue;
                      }

                      debugLog(
                          "EVENT type=%u code=%u value=%d",
                          (unsigned)e.type,
                          (unsigned)e.code,
                          (int)e.value
                      );

                      /*
                       * Original device-loss event.
                       */
                      if (
                          e.type == 0x00 &&
                          e.code == 0x00 &&
                          e.value == 0x0001
                      ) {
                          debugLog(
                              "DEVICE LOST synthetic fd=%d",
                              device.fd
                          );

                          close(device.fd);

                          it =
                              devices.erase(it);

                          continue;
                      }

                      for (
                          int c = 0;
                          c < device.cfg.size();
                          c++
                      ) {
                          auto &pair =
                              device.cfg[c];

                          struct input_event test =
                              pair.first;

                          if (
                              e.type ==
                                  test.type &&
                              e.code ==
                                  test.code &&
                              e.value ==
                                  test.value
                          ) {
                              QByteArray method =
                                  pair.second
                                      .toUtf8();

                              debugLog(
                                  "MATCH method='%s' type=%u code=%u value=%d",
                                  method.constData(),
                                  (unsigned)e.type,
                                  (unsigned)e.code,
                                  (int)e.value
                              );

                              if (
                                  method ==
                                  "singleDouble"
                              ) {
                                  long long clickTime =
                                      monotonicMilliseconds();

                                  /*
                                   * Old pending click already
                                   * expired.
                                   */
                                  if (
                                      pendingSingleClick &&
                                      clickTime >
                                          singleClickDeadline
                                  ) {
                                      long long elapsed =
                                          clickTime -
                                          firstClickTime;

                                      debugLog(
                                          "SINGLEDOUBLE expired elapsed=%lldms -> nextPage",
                                          elapsed
                                      );

                                      pendingSingleClick =
                                          false;

                                      firstClickTime = 0;
                                      singleClickDeadline = 0;

                                      invokeMainWindowController(
                                          "nextPage"
                                      );
                                  }

                                  /*
                                   * Second click.
                                   */
                                  if (
                                      pendingSingleClick
                                  ) {
                                      long long elapsed =
                                          clickTime -
                                          firstClickTime;

                                      debugLog(
                                          "SINGLEDOUBLE second click elapsed=%lldms -> prevPage",
                                          elapsed
                                      );

                                      pendingSingleClick =
                                          false;

                                      firstClickTime = 0;
                                      singleClickDeadline = 0;

                                      invokeMainWindowController(
                                          "prevPage"
                                      );
                                  }
                                  else {
                                      /*
                                       * First click.
                                       */
                                      pendingSingleClick =
                                          true;

                                      firstClickTime =
                                          clickTime;

                                      singleClickDeadline =
                                          clickTime +
                                          DOUBLE_CLICK_MS;

                                      debugLog(
                                          "SINGLEDOUBLE first click time=%lld deadline=%lld window=%lldms",
                                          firstClickTime,
                                          singleClickDeadline,
                                          DOUBLE_CLICK_MS
                                      );
                                  }
                              }
                              else {
                                  debugLog(
                                      "NORMAL invoke method='%s'",
                                      method.constData()
                                  );

                                  invokeMainWindowController(
                                      method.constData()
                                  );
                              }
                          }
                      }

                      it++;
                  }
              }
          }

          static int btpt_init()
          {
              mkdir(
                  BTPT_DIR,
                  0755
              );

              /*
               * Reset debug log on every Nickel start.
               */
              FILE *debug =
                  fopen(
                      "/mnt/onboard/btpt-debug.txt",
                      "w"
                  );

              if (debug) {
                  fputs(
                      "=== kobo-btpt single-double debug v5 ===\n",
                      debug
                  );

                  fclose(debug);
              }

              debugLog(
                  "btpt_init reached"
              );

              debugLog(
                  "BUILD single-double-debug-v5"
              );

              debugLog(
                  "DOUBLE_CLICK_MS=300"
              );

              FILE *marker =
                  fopen(
                      "/mnt/onboard/btpt-loaded.txt",
                      "w"
                  );

              if (marker) {
                  fputs(
                      "kobo-btpt single-double-debug-v5\n",
                      marker
                  );

                  fclose(marker);
              }

              BluetoothPageTurner *btpt =
                  new BluetoothPageTurner();

              QObject::connect(
                  btpt,
                  &QThread::finished,
                  btpt,
                  &QObject::deleteLater
              );

              btpt->start();

              debugLog(
                  "BluetoothPageTurner thread started"
              );

              return 0;
          }

          static struct nh_info btpt_info = {
              .name =
                  "BluetoothPageTurner",

              .desc =
                  "Turn pages with Bluetooth device",

              .uninstall_flag =
                  BTPT_DIR "/uninstall",
          };

          static struct nh_hook btpt_hook[] = {
              {0},
          };

          static struct nh_dlsym btpt_dlsym[] = {
              {
                  .name =
                      "_ZN20MainWindowController14sharedInstanceEv",

                  .out =
                      nh_symoutptr(
                          MainWindowController_sharedInstance
                      )
              },

              {
                  .name =
                      "_ZNK20MainWindowController11currentViewEv",

                  .out =
                      nh_symoutptr(
                          MainWindowController_currentView
                      )
              },

              {0},
          };

          NickelHook(
              .init  = btpt_init,
              .info  = &btpt_info,
              .hook  = btpt_hook,
              .dlsym = btpt_dlsym,
          )
          EOF

      - name: Verify generated source
        shell: bash
        run: |
          echo "=== SOURCE CHECK ==="

          grep -F 'singleDouble' src/btpt.cc
          grep -F 'SINGLEDOUBLE first click' src/btpt.cc
          grep -F 'SINGLEDOUBLE second click' src/btpt.cc
          grep -F 'SINGLEDOUBLE timeout' src/btpt.cc
          grep -F 'ADD config-open OK' src/btpt.cc
          grep -F 'CONFIG line=' src/btpt.cc
          grep -F 'ADD input-open OK' src/btpt.cc
          grep -F 'DEVICE ACQUIRED' src/btpt.cc
          grep -F 'EVENT type=' src/btpt.cc
          grep -F 'MATCH method=' src/btpt.cc
          grep -F 'INVOKE done' src/btpt.cc

          if grep -Fq 'BluetoothHeartbeat' src/btpt.cc; then
            echo "ERROR: BluetoothHeartbeat remains"
            exit 1
          fi

          if grep -Fq 'PowerManager' src/btpt.cc; then
            echo "ERROR: PowerManager remains"
            exit 1
          fi

          if grep -Fq 'TimeLastUsedUpdater' src/btpt.cc; then
            echo "ERROR: TimeLastUsedUpdater remains"
            exit 1
          fi

          echo "SOURCE CHECK OK"

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i \
            's|<linux/input-event-codes.h>|"input-event-codes.h"|' \
            src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify build
        run: |
          echo "=== BUILD RESULT ==="
          test -f KoboRoot.tgz
          ls -lh KoboRoot.tgz
          echo "KoboRoot.tgz OK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-single-double-debug-v5
          path: KoboRoot.tgz
