name: Build kobo-btpt single-double debug v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR32
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Patch Kobo 4.45 single-double permanent debug
        shell: python
        run: |
          from pathlib import Path

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          # ============================================================
          # DEBUG SUPPORT
          # ============================================================

          assert "#include <stdio.h>" in cc

          cc = cc.replace(
              "#include <stdio.h>",
              "#include <stdio.h>\n#include <stdarg.h>",
              1
          )

          # ============================================================
          # KOBO 4.45 COMPATIBILITY
          #
          # Remove fragile private symbols:
          # BluetoothHeartbeat
          # PowerManager
          # TimeEvent
          #
          # Keep only MainWindowController.
          # ============================================================

          start = (
              "/* Stop Bluetooth heartbeat after this many seconds "
              "of inactivity */"
          )

          end = "static void invokeMainWindowController"

          cc = replace_between(
              cc,
              start,
              end,
              """static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          static void debugLog(const char *fmt, ...)
          {
              FILE *f = fopen(
                  "/mnt/onboard/btpt-debug.txt",
                  "a"
              );

              if (!f) {
                  return;
              }

              va_list args;
              va_start(args, fmt);
              vfprintf(f, fmt, args);
              va_end(args);

              fputc('\\n', f);
              fflush(f);
              fclose(f);
          }

          static long long monotonicMilliseconds()
          {
              struct timespec ts;

              clock_gettime(CLOCK_MONOTONIC, &ts);

              return
                  ((long long)ts.tv_sec * 1000LL) +
                  ((long long)ts.tv_nsec / 1000000LL);
          }

          """
          )

          # ============================================================
          # REPLACE ENTIRE invokeMainWindowController()
          #
          # This avoids the mismatch which broke v2.
          # ============================================================

          start = (
              "static void invokeMainWindowController"
              "(const char *method)"
          )

          end = "bool BluetoothPageTurner::addDevice("

          cc = replace_between(
              cc,
              start,
              end,
              """static void invokeMainWindowController(const char *method)
          {
              void *mwc =
                  MainWindowController_sharedInstance();

              if (!mwc) {
                  debugLog(
                      "INVOKE FAILED method='%s' "
                      "reason=no-MainWindowController",
                      method
                  );

                  nh_log("invalid MainWindowController");
                  return;
              }

              QWidget *cv =
                  MainWindowController_currentView(mwc);

              if (!cv) {
                  debugLog(
                      "INVOKE FAILED method='%s' "
                      "reason=no-current-view",
                      method
                  );

                  nh_log("invalid View");
                  return;
              }

              QString name = cv->objectName();

              debugLog(
                  "INVOKE request method='%s' view='%s'",
                  method,
                  name.toUtf8().constData()
              );

              if (name != "ReadingView") {
                  debugLog(
                      "INVOKE SKIPPED method='%s' "
                      "reason=not-reading-view",
                      method
                  );

                  nh_log("not reading view");
                  return;
              }

              bool result = QMetaObject::invokeMethod(
                  cv,
                  method,
                  Qt::QueuedConnection
              );

              debugLog(
                  "INVOKE result method='%s' success=%d",
                  method,
                  result ? 1 : 0
              );
          }

          """
          )

          # ============================================================
          # DEVICE ADD DEBUG
          # ============================================================

          start = """bool BluetoothPageTurner::addDevice(
          \tconst QString &name, const QString &uniq, const QString &handler)
          {"""

          end = "\tint fd;"

          assert start in cc, "Could not find addDevice()"

          cc = replace_between(
              cc,
              start,
              end,
              """bool BluetoothPageTurner::addDevice(
          \tconst QString &name, const QString &uniq, const QString &handler)
          {
          \tdebugLog(
          \t\t"addDevice name='%s' uniq='%s' handler='%s'",
          \t\tname.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\thandler.toUtf8().constData()
          \t);

          """
          )

          # ============================================================
          # CONFIG DEBUG
          # ============================================================

          old = """\tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {"""

          new = """\tdebugLog(
          \t\t"trying config '%s'",
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {
          \t\tdebugLog(
          \t\t\t"CONFIG OPEN FAILED '%s'",
          \t\t\tcfg.fileName().toUtf8().constData()
          \t\t);"""

          assert old in cc, "Could not find config open"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # DEVICE ACQUIRED DEBUG
          # ============================================================

          old = """\tnh_log("acquired device %s: %s","""

          new = """\tdebugLog(
          \t\t"DEVICE ACQUIRED "
          \t\t"handler='%s' uniq='%s' config='%s'",
          \t\thandler.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tnh_log("acquired device %s: %s","""

          assert old in cc, "Could not find acquired-device log"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # SCAN DEBUG
          # ============================================================

          old = (
              '\tnh_log("checking /proc/bus/input/devices '
              'for new devices");'
          )

          new = """\tnh_log(
          \t\t"checking /proc/bus/input/devices for new devices"
          \t);

          \tdebugLog("SCAN /proc/bus/input/devices");"""

          assert old in cc, "Could not find scan log"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # LOG INPUT ENTRIES
          # ============================================================

          old = """\t\telse if (type == "H") {
          \t\t\t/* Skip if not Bluetooth device */"""

          new = """\t\telse if (type == "H") {
          \t\t\tdebugLog(
          \t\t\t\t"INPUT i='%s' name='%s' "
          \t\t\t\t"uniq='%s' handlers='%s'",
          \t\t\t\ti.toUtf8().constData(),
          \t\t\t\tn.toUtf8().constData(),
          \t\t\t\tu.toUtf8().constData(),
          \t\t\t\tline.toUtf8().constData()
          \t\t\t);

          \t\t\t/* Skip if not Bluetooth device */"""

          assert old in cc, "Could not find H handler"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # RUN() STATE
          # ============================================================

          start = "void BluetoothPageTurner::run()\n{"
          end = '\tnh_log("starting");'

          cc = replace_between(
              cc,
              start,
              end,
              """void BluetoothPageTurner::run()
          {
          \tfd_set rfds;
          \tstruct timeval tv;

          \tbool pendingSingleClick = false;
          \tlong long firstClickTime = 0;
          \tlong long singleClickDeadline = 0;

          \tconst long long DOUBLE_CLICK_MS = 300;

          """
          )

          # ============================================================
          # INITIAL DEVICE SCAN FIX
          # ============================================================

          old = 'watcher.addPath("/dev/input");'

          new = '''watcher.addPath("/dev/input");

          \tdebugLog("watching /dev/input");
          \tdebugLog("performing initial device scan");

          \t/*
          \t * Scan devices which were already connected
          \t * before this thread started.
          \t */
          \tscanDevices();'''

          assert old in cc, "Could not find watcher.addPath"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # REMOVE OLD BLUETOOTH HEARTBEAT BLOCK
          # ============================================================

          start = (
              "\t\t/* Bluetooth heartbeat to prevent "
              "Bluetooth from turning off */"
          )

          end = "\t\t/* Poll devices for input events */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ============================================================
          # REPLACE SELECT TIMEOUT
          #
          # Single click needs select() to wake after 300ms.
          # ============================================================

          old = """\t\ttv.tv_sec = 1;
          \t\ttv.tv_usec = 0;"""

          new = """\t\tlong long nowMs =
          \t\t\tmonotonicMilliseconds();

          \t\t/*
          \t\t * A single click survived the double-click
          \t\t * window. Turn forward.
          \t\t */
          \t\tif (
          \t\t\tpendingSingleClick &&
          \t\t\tnowMs >= singleClickDeadline
          \t\t) {
          \t\t\tlong long elapsed =
          \t\t\t\tnowMs - firstClickTime;

          \t\t\tdebugLog(
          \t\t\t\t"SINGLEDOUBLE timeout "
          \t\t\t\t"elapsed=%lldms -> nextPage",
          \t\t\t\telapsed
          \t\t\t);

          \t\t\tpendingSingleClick = false;
          \t\t\tfirstClickTime = 0;
          \t\t\tsingleClickDeadline = 0;

          \t\t\tinvokeMainWindowController(
          \t\t\t\t"nextPage"
          \t\t\t);
          \t\t}

          \t\t/*
          \t\t * If first click is pending, wake exactly
          \t\t * at its deadline.
          \t\t */
          \t\tif (pendingSingleClick) {
          \t\t\tlong long remaining =
          \t\t\t\tsingleClickDeadline -
          \t\t\t\tmonotonicMilliseconds();

          \t\t\tif (remaining < 0) {
          \t\t\t\tremaining = 0;
          \t\t\t}

          \t\t\ttv.tv_sec =
          \t\t\t\tremaining / 1000;

          \t\t\ttv.tv_usec =
          \t\t\t\t(remaining % 1000) * 1000;
          \t\t}
          \t\telse {
          \t\t\ttv.tv_sec = 1;
          \t\t\ttv.tv_usec = 0;
          \t\t}"""

          assert old in cc, "Could not find select timeout"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # RAW EVENT DEBUG
          # ============================================================

          old = """\t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          new = """\t\t\tdebugLog(
          \t\t\t\t"EVENT type=%u code=%u value=%d",
          \t\t\t\t(unsigned)e.type,
          \t\t\t\t(unsigned)e.code,
          \t\t\t\t(int)e.value
          \t\t\t);

          \t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          assert old in cc, "Could not find raw event location"
          cc = cc.replace(old, new, 1)

          # ============================================================
          # REPLACE OLD MATCH ACTION
          #
          # This also removes the old heartbeat timestamp and
          # PowerManager notify code.
          # ============================================================

          start = """\t\t\t\tif (e.type == test.type &&
          \t\t\t\t    e.code == test.code &&
          \t\t\t\t    e.value == test.value) {"""

          end = """\t\t\t\t}
          \t\t\t}"""

          replacement = """\t\t\t\tif (e.type == test.type &&
          \t\t\t\t    e.code == test.code &&
          \t\t\t\t    e.value == test.value) {

          \t\t\t\t\tQByteArray method =
          \t\t\t\t\t\tpair.second.toUtf8();

          \t\t\t\t\tdebugLog(
          \t\t\t\t\t\t"MATCH method='%s' "
          \t\t\t\t\t\t"type=%u code=%u value=%d",
          \t\t\t\t\t\tmethod.constData(),
          \t\t\t\t\t\t(unsigned)e.type,
          \t\t\t\t\t\t(unsigned)e.code,
          \t\t\t\t\t\t(int)e.value
          \t\t\t\t\t);

          \t\t\t\t\tif (method == "singleDouble") {

          \t\t\t\t\t\tlong long clickTime =
          \t\t\t\t\t\t\tmonotonicMilliseconds();

          \t\t\t\t\t\t/*
          \t\t\t\t\t\t * Second click inside window.
          \t\t\t\t\t\t */
          \t\t\t\t\t\tif (
          \t\t\t\t\t\t\tpendingSingleClick &&
          \t\t\t\t\t\t\tclickTime <=
          \t\t\t\t\t\t\t\tsingleClickDeadline
          \t\t\t\t\t\t) {
          \t\t\t\t\t\t\tlong long elapsed =
          \t\t\t\t\t\t\t\tclickTime -
          \t\t\t\t\t\t\t\tfirstClickTime;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE "
          \t\t\t\t\t\t\t\t"second click "
          \t\t\t\t\t\t\t\t"elapsed=%lldms "
          \t\t\t\t\t\t\t\t"-> prevPage",
          \t\t\t\t\t\t\t\telapsed
          \t\t\t\t\t\t\t);

          \t\t\t\t\t\t\tpendingSingleClick =
          \t\t\t\t\t\t\t\tfalse;

          \t\t\t\t\t\t\tfirstClickTime = 0;
          \t\t\t\t\t\t\tsingleClickDeadline = 0;

          \t\t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\t\t"prevPage"
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t\telse {
          \t\t\t\t\t\t\t/*
          \t\t\t\t\t\t\t * First click.
          \t\t\t\t\t\t\t */
          \t\t\t\t\t\t\tpendingSingleClick =
          \t\t\t\t\t\t\t\ttrue;

          \t\t\t\t\t\t\tfirstClickTime =
          \t\t\t\t\t\t\t\tclickTime;

          \t\t\t\t\t\t\tsingleClickDeadline =
          \t\t\t\t\t\t\t\tclickTime +
          \t\t\t\t\t\t\t\tDOUBLE_CLICK_MS;

          \t\t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t\t"SINGLEDOUBLE "
          \t\t\t\t\t\t\t\t"first click "
          \t\t\t\t\t\t\t\t"window=%lldms",
          \t\t\t\t\t\t\t\tDOUBLE_CLICK_MS
          \t\t\t\t\t\t\t);
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t\telse {
          \t\t\t\t\t\tdebugLog(
          \t\t\t\t\t\t\t"NORMAL method='%s'",
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);

          \t\t\t\t\t\tinvokeMainWindowController(
          \t\t\t\t\t\t\tmethod.constData()
          \t\t\t\t\t\t);
          \t\t\t\t\t}
          """

          a = cc.index(start)
          b = cc.index(end, a)

          cc = (
              cc[:a]
              + replacement
              + cc[b:]
          )

          # ============================================================
          # REMOVE TimeLastUsedUpdater
          # ============================================================

          start = "void TimeLastUsedUpdater::notify()"
          end = "static int btpt_init()"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ============================================================
          # INIT WITH PERMANENT DEBUG
          # ============================================================

          start = "static int btpt_init()"
          end = "static struct nh_info btpt_info"

          cc = replace_between(
              cc,
              start,
              end,
              """static int btpt_init()
          {
          \tmkdir(BTPT_DIR, 0755);

          \t/*
          \t * Reset debug file every Nickel startup.
          \t */
          \tFILE *debug = fopen(
          \t\t"/mnt/onboard/btpt-debug.txt",
          \t\t"w"
          \t);

          \tif (debug) {
          \t\tfputs(
          \t\t\t"=== kobo-btpt "
          \t\t\t"single-double debug v3 ===\\n",
          \t\t\tdebug
          \t\t);

          \t\tfclose(debug);
          \t}

          \tdebugLog("btpt_init reached");
          \tdebugLog("BUILD single-double-debug-v3");
          \tdebugLog("DOUBLE_CLICK_MS=300");

          \tFILE *marker = fopen(
          \t\t"/mnt/onboard/btpt-loaded.txt",
          \t\t"w"
          \t);

          \tif (marker) {
          \t\tfputs(
          \t\t\t"kobo-btpt "
          \t\t\t"single-double-debug-v3\\n",
          \t\t\tmarker
          \t\t);

          \t\tfclose(marker);
          \t}

          \tBluetoothPageTurner *btpt =
          \t\tnew BluetoothPageTurner();

          \tQObject::connect(
          \t\tbtpt,
          \t\t&QThread::finished,
          \t\tbtpt,
          \t\t&QObject::deleteLater
          \t);

          \tbtpt->start();

          \tdebugLog(
          \t\t"BluetoothPageTurner thread started"
          \t);

          \treturn 0;
          }

          """
          )

          # ============================================================
          # ONLY SAFE DLSYM SYMBOLS
          # ============================================================

          start = "static struct nh_dlsym btpt_dlsym[] = {"
          end = "NickelHook("

          cc = replace_between(
              cc,
              start,
              end,
              """static struct nh_dlsym btpt_dlsym[] = {
          \t{
          \t\t.name =
          \t\t\t"_ZN20MainWindowController14sharedInstanceEv",
          \t\t.out =
          \t\t\tnh_symoutptr(
          \t\t\t\tMainWindowController_sharedInstance
          \t\t\t)
          \t},
          \t{
          \t\t.name =
          \t\t\t"_ZNK20MainWindowController11currentViewEv",
          \t\t.out =
          \t\t\tnh_symoutptr(
          \t\t\t\tMainWindowController_currentView
          \t\t\t)
          \t},
          \t{0},
          };

          """
          )

          # ============================================================
          # HEADER COMPATIBILITY
          # ============================================================

          start = "class BluetoothPageTurner : public QThread"
          end = "#endif /* BTPT_H */"

          h = replace_between(
              h,
              start,
              end,
              """class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler
              );

              bool scanDevices();
              void learn(Device &device);

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;
              QMutex mutex;
              QWaitCondition newDevice;
              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          """
          )

          # ============================================================
          # WRITE
          # ============================================================

          cc_path.write_text(cc)
          h_path.write_text(h)

          # ============================================================
          # VERIFY
          # ============================================================

          print("=== VERIFY PATCH ===")

          forbidden = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
              "last_event",
              "bluetoothHeartbeat",
          ]

          for item in forbidden:
              print(
                  item,
                  "FOUND" if item in cc else "removed"
              )

              assert item not in cc

          required = [
              "singleDouble",
              "DOUBLE_CLICK_MS = 300",
              "SINGLEDOUBLE first click",
              "SINGLEDOUBLE second click",
              "SINGLEDOUBLE timeout",
              "btpt-debug.txt",
              "EVENT type=%u code=%u value=%d",
              "MATCH method='%s'",
              "INVOKE request",
              "INVOKE result",
              "performing initial device scan",
              "single-double-debug-v3",
          ]

          for item in required:
              print(
                  item,
                  "OK" if item in cc else "MISSING"
              )

              assert item in cc

          assert "TimeLastUsedUpdater" not in h
          assert "void notify();" not in h

          print("Permanent debug: OK")
          print("Kobo 4.45 compatibility: OK")
          print("Initial scan fix: OK")
          print("Single click -> nextPage: OK")
          print("Double click -> prevPage: OK")
          print("Window: 300 ms")
          print("PATCH SUCCESS")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i \
            's|<linux/input-event-codes.h>|"input-event-codes.h"|' \
            src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-single-double-debug-v3
          path: KoboRoot.tgz
