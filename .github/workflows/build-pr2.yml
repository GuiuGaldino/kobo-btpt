name: Build kobo-btpt 4.45 debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR32
        uses: actions/checkout@v4
        with:
          repository: pgaskin/kobo-btpt
          ref: update-nh
          submodules: recursive

      - name: Patch for Kobo 4.45 with debug
        shell: python
        run: |
          from pathlib import Path

          cc_path = Path("src/btpt.cc")
          h_path = Path("src/btpt.h")

          cc = cc_path.read_text()
          h = h_path.read_text()

          def replace_between(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          # ------------------------------------------------------------
          # Add stdarg support for debugLog().
          # ------------------------------------------------------------
          cc = cc.replace(
              "#include <stdio.h>",
              "#include <stdio.h>\n#include <stdarg.h>",
              1
          )

          # ------------------------------------------------------------
          # Remove fragile private Nickel symbols.
          # Keep only MainWindowController.
          # ------------------------------------------------------------
          start = "/* Stop Bluetooth heartbeat after this many seconds of inactivity */"
          end = "static void invokeMainWindowController"

          cc = replace_between(
              cc,
              start,
              end,
              """static void *(*MainWindowController_sharedInstance)();
          static QWidget *(*MainWindowController_currentView)(void *);

          static void debugLog(const char *fmt, ...)
          {
              FILE *f = fopen("/mnt/onboard/btpt-debug.txt", "a");
              if (!f) {
                  return;
              }

              va_list args;
              va_start(args, fmt);
              vfprintf(f, fmt, args);
              va_end(args);

              fputc('\\n', f);
              fclose(f);
          }

          """
          )

          # ------------------------------------------------------------
          # Add diagnostics when trying to add a device.
          # ------------------------------------------------------------
          old = """{
              int fd;"""

          # Source uses tabs, so handle that form too.
          if old not in cc:
              old = """{
          \tint fd;"""

          new = """{
              debugLog(
                  "addDevice name='%s' uniq='%s' handler='%s'",
                  name.toUtf8().constData(),
                  uniq.toUtf8().constData(),
                  handler.toUtf8().constData()
              );

              int fd;"""

          assert old in cc, "Could not patch addDevice start"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Log which configuration filename is selected.
          # ------------------------------------------------------------
          old = """\tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {"""

          new = """\tdebugLog(
          \t\t"trying config '%s'",
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tif (!cfg.open(QIODevice::ReadOnly | QIODevice::Text)) {
          \t\tdebugLog(
          \t\t\t"CONFIG OPEN FAILED '%s'",
          \t\t\tcfg.fileName().toUtf8().constData()
          \t\t);"""

          assert old in cc, "Could not patch config open"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Log successfully acquired device.
          # ------------------------------------------------------------
          old = """\tnh_log("acquired device %s: %s","""

          new = """\tdebugLog(
          \t\t"DEVICE ACQUIRED handler='%s' uniq='%s' config='%s'",
          \t\thandler.toUtf8().constData(),
          \t\tuniq.toUtf8().constData(),
          \t\tcfg.fileName().toUtf8().constData()
          \t);

          \tnh_log("acquired device %s: %s","""

          assert old in cc, "Could not patch acquired device"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Log every input-device scan.
          # ------------------------------------------------------------
          old = """\tnh_log("checking /proc/bus/input/devices for new devices");"""

          new = """\tnh_log("checking /proc/bus/input/devices for new devices");
          \tdebugLog("SCAN /proc/bus/input/devices");"""

          assert old in cc, "Could not patch scan logging"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Log each input entry when its handlers are encountered.
          # This tells us bus/name/address/handlers.
          # ------------------------------------------------------------
          old = """\t\telse if (type == "H") {
          \t\t\t/* Skip if not Bluetooth device */"""

          new = """\t\telse if (type == "H") {
          \t\t\tdebugLog(
          \t\t\t\t"INPUT i='%s' name='%s' uniq='%s' handlers='%s'",
          \t\t\t\ti.toUtf8().constData(),
          \t\t\t\tn.toUtf8().constData(),
          \t\t\t\tu.toUtf8().constData(),
          \t\t\t\tline.toUtf8().constData()
          \t\t\t);

          \t\t\t/* Skip if not Bluetooth device */"""

          assert old in cc, "Could not patch input-device logging"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Simplify BluetoothPageTurner::run().
          # Removes old heartbeat state.
          # ------------------------------------------------------------
          start = "void BluetoothPageTurner::run()\n{"
          end = '\tnh_log("starting");'

          cc = replace_between(
              cc,
              start,
              end,
              """void BluetoothPageTurner::run()
          {
              fd_set rfds;
              struct timeval tv;

          """
          )

          # ------------------------------------------------------------
          # Initial scan: fixes devices already connected at startup.
          # ------------------------------------------------------------
          old = 'watcher.addPath("/dev/input");'

          new = '''watcher.addPath("/dev/input");

              debugLog("watching /dev/input");
              debugLog("performing initial device scan");

              /* Scan devices which were already connected at startup */
              scanDevices();'''

          assert old in cc, "Could not find watcher.addPath"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Remove Bluetooth heartbeat.
          # ------------------------------------------------------------
          start = "\t\t/* Bluetooth heartbeat to prevent Bluetooth from turning off */"
          end = "\t\t/* Poll devices for input events */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ------------------------------------------------------------
          # Remove PowerManager handling.
          # ------------------------------------------------------------
          start = "\t\t\t\t\t/* Update Bluetooth heartbeat time */"
          end = "\t\t\t\t\t/* Invoke the configured method */"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ------------------------------------------------------------
          # Log EVERY raw input event received from acquired devices.
          # ------------------------------------------------------------
          old = """\t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          new = """\t\t\tdebugLog(
          \t\t\t\t"EVENT type=%u code=%u value=%d",
          \t\t\t\t(unsigned)e.type,
          \t\t\t\t(unsigned)e.code,
          \t\t\t\t(int)e.value
          \t\t\t);

          \t\t\tif (e.type == 0x00 &&
          \t\t\t    e.code == 0x00 &&
          \t\t\t    e.value == 0x0001) {"""

          assert old in cc, "Could not patch event logging"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Fix temporary c_str pointer.
          # ------------------------------------------------------------
          old = """\t\t\t\t\tconst char *method = pair.second
          \t\t\t\t\t\t.toStdString().c_str();
          \t\t\t\t\tinvokeMainWindowController(method);"""

          new = """\t\t\t\t\tQByteArray method = pair.second.toUtf8();

          \t\t\t\t\tdebugLog(
          \t\t\t\t\t\t"MATCH method='%s' type=%u code=%u value=%d",
          \t\t\t\t\t\tmethod.constData(),
          \t\t\t\t\t\t(unsigned)e.type,
          \t\t\t\t\t\t(unsigned)e.code,
          \t\t\t\t\t\t(int)e.value
          \t\t\t\t\t);

          \t\t\t\t\tinvokeMainWindowController(method.constData());"""

          assert old in cc, "Could not patch method invocation"
          cc = cc.replace(old, new, 1)

          # ------------------------------------------------------------
          # Remove TimeLastUsedUpdater implementation.
          # ------------------------------------------------------------
          start = "void TimeLastUsedUpdater::notify()"
          end = "static int btpt_init()"

          cc = replace_between(
              cc,
              start,
              end,
              ""
          )

          # ------------------------------------------------------------
          # Minimal btpt_init + reset debug file on every Nickel startup.
          # ------------------------------------------------------------
          start = "static int btpt_init()"
          end = "static struct nh_info btpt_info"

          cc = replace_between(
              cc,
              start,
              end,
              """static int btpt_init()
          {
              mkdir(BTPT_DIR, 0755);

              FILE *marker = fopen("/mnt/onboard/btpt-loaded.txt", "w");
              if (marker) {
                  fputs("kobo-btpt init reached\\n", marker);
                  fclose(marker);
              }

              FILE *debug = fopen("/mnt/onboard/btpt-debug.txt", "w");
              if (debug) {
                  fputs("=== kobo-btpt debug start ===\\n", debug);
                  fclose(debug);
              }

              debugLog("btpt_init reached");

              BluetoothPageTurner *btpt = new BluetoothPageTurner();

              QObject::connect(
                  btpt,
                  &QThread::finished,
                  btpt,
                  &QObject::deleteLater
              );

              btpt->start();

              debugLog("BluetoothPageTurner thread started");

              return 0;
          }

          """
          )

          # ------------------------------------------------------------
          # Keep only MainWindowController dlsym symbols.
          # ------------------------------------------------------------
          start = "static struct nh_dlsym btpt_dlsym[] = {"
          end = "NickelHook("

          cc = replace_between(
              cc,
              start,
              end,
              """static struct nh_dlsym btpt_dlsym[] = {
              {
                  .name = "_ZN20MainWindowController14sharedInstanceEv",
                  .out = nh_symoutptr(MainWindowController_sharedInstance)
              },
              {
                  .name = "_ZNK20MainWindowController11currentViewEv",
                  .out = nh_symoutptr(MainWindowController_currentView)
              },
              {0},
          };

          """
          )

          # ------------------------------------------------------------
          # Simplify header to remove TimeLastUsedUpdater and notify signal.
          # ------------------------------------------------------------
          start = "class BluetoothPageTurner : public QThread"
          end = "#endif /* BTPT_H */"

          h = replace_between(
              h,
              start,
              end,
              """class BluetoothPageTurner : public QThread
          {
              Q_OBJECT

              void run() override;

          private:
              bool addDevice(
                  const QString &name,
                  const QString &uniq,
                  const QString &handler);
              bool scanDevices();
              void learn(Device &device);

              QFileSystemWatcher watcher;
              QMap<QString, Device> devices;
              QMutex mutex;
              QWaitCondition newDevice;
              int deviceChanges = 0;

          public slots:
              void directoryChanged(const QString &path);
          };

          """
          )

          cc_path.write_text(cc)
          h_path.write_text(h)

          print("=== Checking patch ===")

          forbidden = [
              "BluetoothHeartbeat",
              "PowerManager",
              "TimeEvent",
              "TimeLastUsedUpdater",
              "emit notify",
              "last_event",
              "bluetoothHeartbeat",
          ]

          for item in forbidden:
              print(
                  item,
                  "FOUND" if item in cc else "removed"
              )

          assert all(item not in cc for item in forbidden)
          assert "TimeLastUsedUpdater" not in h
          assert "void notify();" not in h

          assert "btpt-debug.txt" in cc
          assert "EVENT type=%u code=%u value=%d" in cc
          assert "performing initial device scan" in cc

          print("debug logging: OK")
          print("initial scan: OK")
          print("Patch OK")

      - name: Fix Linux input header
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            --entrypoint bash \
            ghcr.io/pgaskin/nickeltc:1.0 \
            -c 'cp /usr/include/linux/input-event-codes.h src/input-event-codes.h'

          sed -i 's|<linux/input-event-codes.h>|"input-event-codes.h"|' src/eventcodes.cc

      - name: Build with NickelTC
        run: |
          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            --entrypoint make \
            ghcr.io/pgaskin/nickeltc:1.0 \
            clean all koboroot

      - name: Verify KoboRoot
        run: |
          ls -lh KoboRoot.tgz
          test -f KoboRoot.tgz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kobo-btpt-445-debug
          path: KoboRoot.tgz
